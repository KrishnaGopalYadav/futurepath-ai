name: R1 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  r1:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: futurepath_ci_password
      POSTGRES_DB: futurepath
      POSTGRES_USER: futurepath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run R1 unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Build and start R1 services
        run: docker compose up -d --build
      - name: Apply migrations
        run: docker compose exec -T api alembic -c /app/alembic.ini upgrade head
      - name: Verify API health
        run: curl --fail --retry 10 --retry-delay 2 http://localhost:8000/health
      - name: Verify worker is ready
        run: docker compose logs worker | grep -q 'ready.'
      - name: Tear down
        if: always()
        run: docker compose down -v
